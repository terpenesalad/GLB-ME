name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths-ignore: ["desktop/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(tr -d ' \n\r' < version.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "v$BASE" >/dev/null 2>&1; then
            # a version bump in version.txt on main publishes a new release automatically
            echo "name=$BASE" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "name=$BASE-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests + release APK
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/GLB-ME-${{ steps.ver.outputs.name }}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GLB-ME-${{ steps.ver.outputs.name }}
          path: dist/*

      - name: Publish GitHub release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          NOTES_FILE=RELEASE_NOTES.md
          [ -f "$NOTES_FILE" ] || echo "GLB&ME ${TAG}" > "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "GLB&ME ${TAG}" --notes-file "$NOTES_FILE" --latest
          fi

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed for \`${GITHUB_SHA}\` ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))"
            echo
            echo '```'
            if [ -f build.log ]; then grep -E "^e: |error:|FAILURE|What went wrong|> |BUILD FAILED|Exception" build.log | head -120; echo "----- tail -----"; tail -60 build.log; else echo "no build log"; fi
            echo '```'
          } > report.md
          NUM=$(gh issue list --state open --label ci-failure --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file report.md
          else
            gh label create ci-failure --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "CI build failure" --label ci-failure --body-file report.md
          fi
