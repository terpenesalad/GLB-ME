name: Build & Release Desktop

# Builds the Windows installer (+ portable exe), the macOS dmg and Linux AppImage/deb from desktop/
# and attaches them to the GitHub release "v<desktop/package.json version>" (created if missing).
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            exe: release/win-unpacked/GLB-ME.exe
          - os: macos-latest
            target: --mac
            exe: release/mac-universal/GLB&ME.app/Contents/MacOS/GLB&ME
          - os: ubuntu-latest
            target: --linux
            exe: release/linux-unpacked/glbandme-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Bundle
        run: npm run build

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Smoke test the packaged app (launch, open editor, save)
        timeout-minutes: 6
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a node scripts/smoke.mjs "${{ matrix.exe }}" smoke; else node scripts/smoke.mjs "${{ matrix.exe }}" smoke; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: desktop/smoke/*
          if-no-files-found: ignore

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp release/*.exe release/*.dmg release/*.AppImage release/*.deb out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/out/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v$VERSION"
          ls -la artifacts
          (cd artifacts && sha256sum * > SHA256SUMS-desktop.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "GLB&ME $VERSION" --notes "GLB&ME $VERSION" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" artifacts/* --clobber
          for stray in home.png editor.png failure.png; do gh release delete-asset "$TAG" "$stray" -y 2>/dev/null || true; done
          python3 .github/scripts/release_notes.py "$VERSION" > notes.md
          gh release edit "$TAG" --notes-file notes.md
